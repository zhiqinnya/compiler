name: Build Python 3.13.7 Binary

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make build-essential libssl-dev zlib1g-dev \
            libbz2-dev libreadline-dev libsqlite3-dev wget curl llvm \
            libncurses5-dev libncursesw5-dev xz-utils tk-dev liblzma-dev

      - name: Download and compile Python
        run: |
          wget https://www.python.org/ftp/python/3.13.7/Python-3.13.7.tgz
          tar xzf Python-3.13.7.tgz
          cd Python-3.13.7
          ./configure --prefix=$GITHUB_WORKSPACE/python-dist --enable-optimizations
          make -j$(nproc)
          make install

      - name: Archive compiled Python
        run: |
          tar -czf python3.13.7-debian.tar.gz -C python-dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-binary
          path: python3.13.7-debian.tar.gz
